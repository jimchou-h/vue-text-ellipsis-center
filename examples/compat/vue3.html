<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Vue 3 示例</title>
    <style>
      #app {
        width: 240px;
        font: 14px/1.5 sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <text-ellipsis-center
        text="这是一段用于 Vue 3 示例的超长文本内容，会在中间位置自动省略。"
        direction="middle"
      ></text-ellipsis-center>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="./vendor/vue-demi.iife.js"></script>
    <script src="./vendor/vue-text-ellipsis-center.umd.js"></script>
    <script>
      const app = Vue.createApp({});
      app.use(window["vue-text-ellipsis-center"].default);
      app.mount("#app");
    </script>
  </body>
</html>
